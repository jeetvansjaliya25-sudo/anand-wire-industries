# Render Blueprint – Anand Wire Industries website (static Vite/React build)
services:
  - type: web
    runtime: static
    name: anand-wire-industries
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    domains:
      - anandwireindustries.in
      - www.anandwireindustries.in
    headers:
      # PDF.js worker is an .mjs file – serve it as JavaScript
      - path: /assets/*.mjs
        name: Content-Type
        value: text/javascript
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
